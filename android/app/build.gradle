// Trusted Web Activity wrappers for the MS BEAU AVE apps.
//
// A TWA is a thin native shell that opens a URL full-screen in the user's
// Chrome engine, so the app content updates whenever the website does — no
// reinstall needed to ship a change. Every flavour below builds from this one
// source and differs only in its name, its icon and the address it opens:
// the customer shop, the back office, three time clocks and the resellers.
plugins { id 'com.android.application' }

android {
    namespace 'com.msbeauave.twa'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode project.hasProperty('vcode') ? project.vcode.toInteger() : 3
        versionName project.hasProperty('vname') ? project.vname : '3.0'
    }

    signingConfigs {
        release {
            storeFile file(project.findProperty('storeFile') ?: 'msbeauave.keystore')
            storePassword project.findProperty('storePassword') ?: ''
            keyAlias project.findProperty('keyAlias') ?: 'msbeauave'
            keyPassword project.findProperty('keyPassword') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    flavorDimensions += 'app'
    productFlavors {
        shop {
            dimension 'app'
            applicationId 'com.msbeauave.shop'
            resValue 'string', 'app_name', 'MS BEAU AVE'
            resValue 'string', 'launch_url', 'https://msbeauave-ops.vercel.app/shop/'
            resValue 'string', 'host_name', 'msbeauave-ops.vercel.app'
        }
        backoffice {
            dimension 'app'
            applicationId 'com.msbeauave.backoffice'
            resValue 'string', 'app_name', 'MBA back office'
            resValue 'string', 'launch_url', 'https://msbeauave-ops.vercel.app/'
            resValue 'string', 'host_name', 'msbeauave-ops.vercel.app'
        }
        // For everybody who works here. The same website as the back office,
        // opened at ?app=staff so the sign-in says what it is for — "your
        // record, your leave, your hours" rather than stock and reseller
        // orders. Its own icon so somebody coming to look at their own hours
        // opens something called MBA Staff.
        staff {
            dimension 'app'
            applicationId 'com.msbeauave.staff'
            resValue 'string', 'app_name', 'MBA Staff'
            resValue 'string', 'launch_url', 'https://msbeauave-ops.vercel.app/?app=staff'
            resValue 'string', 'host_name', 'msbeauave-ops.vercel.app'
        }
        // Beauty Obsession Avenue Corp is a company of its own rather than a
        // branch, and its people know it by its own logo. brand=boa puts their
        // mark and their name on the sign-in and the header and changes
        // nothing else — same system, same database, same rules, same rose.
        // A brand read out of a query string decides only what is drawn.
        boastaff {
            dimension 'app'
            applicationId 'com.msbeauave.boastaff'
            resValue 'string', 'app_name', 'BOA Staff'
            resValue 'string', 'launch_url', 'https://msbeauave-ops.vercel.app/?app=staff&brand=boa'
            resValue 'string', 'host_name', 'msbeauave-ops.vercel.app'
        }
        // The tablet by the door. Its own app rather than a page inside the
        // back office, so what sits on the counter all day opens on the clock
        // and can reach nothing else — no till, no stock, no takings.
        clock {
            dimension 'app'
            applicationId 'com.msbeauave.clock'
            resValue 'string', 'app_name', 'MBA time clock'
            resValue 'string', 'launch_url', 'https://msbeauave-ops.vercel.app/clock/'
            resValue 'string', 'host_name', 'msbeauave-ops.vercel.app'
        }
        // One icon per shop. ?shop= fixes the branch in the address, so the
        // tablet at a door is that door's clock and shows only its own faces —
        // nothing to pick, and nothing to pick wrongly.
        clockbb {
            dimension 'app'
            applicationId 'com.msbeauave.clock.bayanbayanan'
            resValue 'string', 'app_name', 'Clock — Bayan Bayanan'
            resValue 'string', 'launch_url', 'https://msbeauave-ops.vercel.app/clock/?shop=1'
            resValue 'string', 'host_name', 'msbeauave-ops.vercel.app'
        }
        clockdao {
            dimension 'app'
            applicationId 'com.msbeauave.clock.dao'
            resValue 'string', 'app_name', 'Clock — Dao'
            resValue 'string', 'launch_url', 'https://msbeauave-ops.vercel.app/clock/?shop=2'
            resValue 'string', 'host_name', 'msbeauave-ops.vercel.app'
        }
        // The resellers' own app. It opens the same system the back office
        // does — what a reseller may see is settled by their sign-in and
        // enforced in the database — but it arrives on their phone called
        // Resellers, opening on their catalogue, with no staff menu to ignore.
        reseller {
            dimension 'app'
            applicationId 'com.msbeauave.reseller'
            resValue 'string', 'app_name', 'MBA resellers'
            resValue 'string', 'launch_url', 'https://msbeauave-ops.vercel.app/portal/'
            resValue 'string', 'host_name', 'msbeauave-ops.vercel.app'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
